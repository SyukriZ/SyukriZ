<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 52" width="200" height="52" role="img" xmlns:c2pa="http://c2pa.org/manifest">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c12"/><stop offset="1" stop-color="#030304"/></linearGradient>
  <radialGradient id="n1"><stop offset="0" stop-color="#cfd3e6" stop-opacity=".24"/><stop offset="1" stop-color="#cfd3e6" stop-opacity="0"/></radialGradient>
  <radialGradient id="n2"><stop offset="0" stop-color="#8d93ad" stop-opacity=".22"/><stop offset="1" stop-color="#8d93ad" stop-opacity="0"/></radialGradient>
  <radialGradient id="core"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".25" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="pl" cx=".34" cy=".3" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".45" stop-color="#9aa0b8" stop-opacity=".7"/><stop offset="1" stop-color="#0c0d14" stop-opacity=".95"/></radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity=".30"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
</defs>
<style>
  .tw{animation:tw 5s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .ss{opacity:0;animation:ss 12s linear infinite}
  @keyframes ss{0%{opacity:0;transform:translateX(0)}3%{opacity:1}12%{opacity:0;transform:translateX(560px)}100%{opacity:0;transform:translateX(560px)}}
  .gas1{animation:gas1 38s ease-in-out infinite alternate}
  .gas2{animation:gas2 52s ease-in-out infinite alternate}
  @keyframes gas1{from{transform:translate(0,0)}to{transform:translate(70px,18px)}}
  @keyframes gas2{from{transform:translate(0,0)}to{transform:translate(-60px,-14px)}}
  .flt{animation:flt 9s ease-in-out infinite alternate}
  @keyframes flt{from{transform:translateY(-5px)}to{transform:translateY(5px)}}
</style>

<rect width="200" height="52" rx="26" fill="url(#bg)"/>
<g filter="url(#blur)">
  <ellipse class="gas1" cx="40.0" cy="16.64" rx="320" ry="130" fill="url(#n2)"/>
  <ellipse class="gas2" cx="124.0" cy="40.56" rx="300" ry="90" fill="url(#n1)" opacity=".7"/>
</g>

<circle cx="172.0" cy="33.4" r="1.3" fill="#fff" opacity="0.44" class="tw" style="animation-delay:4.7s;animation-duration:6.5s"/>
<circle cx="167.9" cy="17.8" r="1.0" fill="#fff" opacity="0.4" class="tw" style="animation-delay:5.2s;animation-duration:6.9s"/>
<circle cx="95.6" cy="13.4" r="0.6" fill="#fff" opacity="0.58" class="tw" style="animation-delay:3.9s;animation-duration:6.8s"/>
<circle cx="168.4" cy="42.0" r="0.8" fill="#fff" opacity="0.77" class="tw" style="animation-delay:2.5s;animation-duration:6.2s"/>
<circle cx="49.9" cy="33.9" r="1.3" fill="#fff" opacity="0.32" class="tw" style="animation-delay:0.4s;animation-duration:5.1s"/>
<circle cx="33.4" cy="38.2" r="1.3" fill="#fff" opacity="0.82" class="tw" style="animation-delay:0.0s;animation-duration:4.0s"/>


<rect x="3" y="3" width="194" height="46" rx="23" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2"/><rect x="26" y="4" width="148" height="1" fill="url(#shine)"/><text x="100" y="31" text-anchor="middle" font-family="'Inter','SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="5" fill="#eceef5">EMAIL</text>
